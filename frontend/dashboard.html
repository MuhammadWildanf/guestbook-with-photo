<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>Guest Book</title>
    <!-- Tambahkan sebelum </head> -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" />
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css" />
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
</head>

<body>
    <div class="container my-4">
        <h2 class="mb-4 text-center">Guest Book Dashboard</h2>
        <div class="mb-3 text-end">
            <button class="btn btn-danger" id="deleteAllBtn">
                <i class="fa fa-trash"></i> Hapus Semua Data
            </button>
        </div>
        <div class="table-responsive">
            <table id="guestbook-table" class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>No</th>
                        <th>Foto 1</th>
                        <th>Foto 2</th>
                        <th>Aksesoris</th>
                        <th>Badan</th>
                        <th>Tangan</th>
                        <th>Kaki</th>
                        <th>Waktu</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data akan diisi di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Detail Outfit (Optional for future use if needed) -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalLabel">Detail Entry</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div id="detailPhotos" class="d-flex justify-content-center gap-2 mb-3"></div>
                    <div id="detailOutfit" class="text-start"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            let table = $('#guestbook-table').DataTable({
                responsive: true,
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'excelHtml5',
                        text: 'Export Excel',
                        exportOptions: {
                            columns: [0, 1, 2, 3, 4, 5, 6, 7],
                            format: {
                                body: function (data, row, column, node) {
                                    // Untuk kolom Foto (1 & 2), ambil URL-nya saja untuk Excel
                                    if (column === 1 || column === 2) {
                                        const img = $(node).find('img');
                                        return img.length ? img.attr('src') : '-';
                                    }
                                    return data;
                                }
                            }
                        }
                    }
                ],
                columns: [
                    { data: null }, // Nomor urut
                    {
                        data: 'photo1Url', render: function (data) {
                            return data ? `<img src="${data}" class="img-fluid rounded" style="max-width:80px;max-height:100px;object-fit:cover;" alt="Foto 1"/>` : '-';
                        }
                    },
                    {
                        data: 'photo2Url', render: function (data) {
                            return data ? `<img src="${data}" class="img-fluid rounded" style="max-width:80px;max-height:100px;object-fit:cover;" alt="Foto 2"/>` : '-';
                        }
                    },
                    {
                        data: 'outfit.acc',
                        render: function (data) { return data || '-'; }
                    },
                    {
                        data: 'outfit.body',
                        render: function (data) { return data || '-'; }
                    },
                    {
                        data: 'outfit.hand',
                        render: function (data) { return data || '-'; }
                    },
                    {
                        data: 'outfit.leg',
                        render: function (data) { return data || '-'; }
                    },
                    {
                        data: 'timestamp', render: function (data) {
                            return data ? new Date(data).toLocaleString() : '';
                        }
                    },
                    {
                        data: null, orderable: false, render: function (data, type, row) {
                            return `
                                <button class="btn btn-sm btn-danger" onclick="deleteEntry('${row.key}')">
                                    <i class="fa fa-trash"></i> Delete
                                </button>
                            `;
                        }
                    }
                ],
                order: [[7, 'desc']], // Urutkan berdasarkan waktu (terbaru dulu)
                columnDefs: [
                    {
                        targets: 0,
                        render: function (data, type, row, meta) {
                            return meta.row + 1;
                        },
                        orderable: false
                    }
                ]
            });

            function loadTable() {
                fetch('/entries')
                    .then(res => res.json())
                    .then(data => {
                        let arr = [];
                        if (data) {
                            Object.entries(data).forEach(([key, entry]) => {
                                arr.push({ ...entry, key });
                            });
                            // Sort descending by timestamp for display
                            arr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        }
                        console.log('Data loaded:', arr);
                        table.clear().rows.add(arr).draw();
                    });
            }
            loadTable();

            window.deleteEntry = function (key) {
                if (confirm('Yakin ingin menghapus data ini?')) {
                    fetch(`/entries/${key}`, { method: 'DELETE' })
                        .then(res => res.json())
                        .then(result => {
                            if (result.success) {
                                loadTable();
                            } else {
                                alert('Gagal menghapus data');
                            }
                        });
                }
            }

            $('#deleteAllBtn').on('click', function () {
                if (confirm('Yakin ingin menghapus SEMUA data?')) {
                    fetch('/entries-all', { method: 'DELETE' })
                        .then(res => res.json())
                        .then(result => {
                            if (result.success) {
                                loadTable();
                            } else {
                                alert('Gagal menghapus semua data');
                            }
                        });
                }
            });
        });
    </script>
</body>

</html>
